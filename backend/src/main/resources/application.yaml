spring:

  application:
    name: demo

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH_CLIENT_ID}
            client-secret: ${OAUTH_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

app:
  oauth2:
    postman-client-secret: ${POSTMAN_CLIENT_SECRET}
  openapi:
    authorization-url: ${OPENAPI_AUTHORIZATION_URL}
    token-url: ${OPENAPI_TOKEN_URL}

  security:
    issuer: ${MECHANICFLOW_ISSUER:http://localhost:8080}
    jwk:
      keystore-location: ${JWK_KEYSTORE}
      keystore-password: ${JWK_KEYSTORE_PASSWORD}
      key-alias: mechanicflow-signing

springdoc:
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    oauth2-redirect-url: http://localhost:8080/swagger-ui/oauth2-redirect.html
    oauth:
      client-id: mechanicflow-swagger-ui
      scopes:
        - mechanicflow.api
      use-pkce-with-authorization-code-grant: true
    disable-swagger-default-url: true